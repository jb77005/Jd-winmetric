<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JD WinMetric</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #bbb;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .admin-box,
    .matches-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .full {
      grid-column: 1 / -1;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .match-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px;
      margin-top: 15px;
      background: #fafafa;
    }

    .teams {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .league {
      color: #666;
      font-size: 14px;
    }

    .prediction {
      margin-top: 12px;
      font-weight: bold;
    }

    .probability {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .analysis {
      margin-top: 10px;
      color: #444;
      line-height: 1.5;
    }

    .delete-btn {
      margin-top: 12px;
      background: #b00020;
      font-size: 14px;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 20px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>JD WinMetric</h1>
    <p>Football Match Analysis & Predictions</p>
  </header>

  <div class="container">

    <!-- ADD MATCH -->
    <div class="admin
